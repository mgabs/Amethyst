repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: swiftlint
        name: SwiftLint
        entry: bash -c 'if command -v swiftlint >/dev/null; then swiftlint --lint --quiet; else echo "SwiftLint not installed, skipping..."; fi'
        language: system
        files: \.swift$
        pass_filenames: false
