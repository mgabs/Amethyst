name: Release

# Every push to master whose MARKETING_VERSION (Amethyst.xcodeproj) has no release yet is built,
# tagged vX.Y.Z, and published. Bump the version, merge to master, done.
# A version containing "-" (1.0.0-beta.1) is published as a pre-release, which the updater skips.
on:
  push:
    branches: [master]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      released: ${{ steps.v.outputs.released }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(sed -nE 's/.*MARKETING_VERSION = ([^;]+);.*/\1/p' Amethyst.xcodeproj/project.pbxproj | head -1)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"; echo "$TAG already released, nothing to do"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"; echo "releasing $TAG"
          fi

  release:
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.tag }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build number = commit count

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASSWORD }}

      # Same lane as a local release build: signed archive + export, zips app and dSYMs into build/artifacts
      - name: Build
        run: bundle exec fastlane mac

      - name: Generate Sparkle appcast
        if: env.HAS_SPARKLE_KEY == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir build/appcast && cp build/artifacts/Amethyst-v*-b*.zip build/appcast/
          # generate_appcast ships with the Sparkle SwiftPM artifact, so the tool version always matches the framework
          echo "$SPARKLE_PRIVATE_KEY" | build/derived_data/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "$REPO_URL/releases/download/$VERSION/" \
            --link "$REPO_URL/releases" \
            -o build/appcast.xml build/appcast

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          tag_name: ${{ env.VERSION }}
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: |
            build/artifacts/Amethyst-*.zip
            build/appcast.xml
