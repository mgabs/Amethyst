name: Sync Wiki

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Wiki Content
        run: |
          mkdir -p wiki-staging/images
          # Reference docs (docs/*.md) and wiki pages (docs/wiki/*.md) share the wiki root
          cp docs/*.md wiki-staging/
          cp docs/wiki/*.md wiki-staging/
          cp docs/images/* wiki-staging/images/

          cat << 'EOF' > wiki-staging/_Sidebar.md
**[Home](Home)**

**Use**
* [Installation](Installation)
* [Getting Started](Getting-Started)
* [Keyboard Shortcuts](Keyboard-Shortcuts)
* [Layouts](Layouts)
* [Space Indicator](Space-Indicator)
* [Configuration Files](configuration-files)
* [Custom Layouts](custom-layouts)
* [Window Limit](window-limit)
* [Troubleshooting](troubleshooting)

**Project**
* [Architecture](Architecture)
* [Building and Releasing](Building-and-Releasing)
* [Fork Differences](Fork-Differences)

---
[GitHub Repository](https://github.com/mgabs/Amethyst)
EOF

          # Rewrite repo-relative links so they resolve on the wiki
          BLOB=https://github.com/mgabs/Amethyst/blob/master
          TREE=https://github.com/mgabs/Amethyst/tree/master
          sed -i -E \
            -e 's|\]\(\.\./\.amethyst\.sample\.yml\)|]('"$BLOB"'/.amethyst.sample.yml)|g' \
            -e 's|\]\(\.\./(AmethystTests/[^)]*)\)|]('"$TREE"'/\1)|g' \
            -e 's|\./images/|images/|g' \
            wiki-staging/*.md

      - name: Push to Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_WIKI="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git clone "$REPO_WIKI" wiki-repo 2>/dev/null; then
            cd wiki-repo
            git rm -rq --ignore-unmatch . 
          else
            echo "Wiki repo not cloned. Initializing."
            mkdir wiki-repo && cd wiki-repo
            git init -b master
            git remote add origin "$REPO_WIKI"
          fi
          cp -r ../wiki-staging/. .

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs(wiki): sync from docs/ [skip ci]"
            git push -u origin HEAD:master
          else
            echo "No wiki changes to sync."
          fi
